<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Habit Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; max-width: 600px; margin: auto; padding: 1rem; }
        .habit { border: 1px solid #ccc; margin: 1rem 0; padding: 1rem; border-radius: 8px; }
        button { background: green; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📋 Habit Tracker</h1>
    <div id="habits">Loading...</div>
    <script>
        const RAW_URL = 'https://raw.githubusercontent.com/ena050405-commits/habit-tracker/main/habits.json';
        
        async function load() {
            const res = await fetch(RAW_URL + '?t=' + Date.now());
            const data = await res.json();
            const container = document.getElementById('habits');
            let html = '';
            for (let h of data.habits) {
                const last = new Date(h.last_check);
                const now = new Date();
                const hoursDiff = (now - last) / (1000 * 3600);
                const status = hoursDiff >= h.interval_hours ? '🔴 Time!' : `🟢 ${(h.interval_hours - hoursDiff).toFixed(1)}h left`;
                html += `<div class="habit"><strong>${h.name}</strong> (every ${h.interval_hours}h)<br>Last: ${last.toLocaleString()}<br>Status: ${status}<br><button disabled>✅ Log (coming soon)</button></div>`;
            }
            container.innerHTML = html;
        }
        load();
    </script>
</body>
</html>
